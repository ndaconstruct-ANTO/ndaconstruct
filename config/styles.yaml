# =============================================================================
# Bibliotheque de STYLES / METIERS - extensible a l'infini
# =============================================================================
# Pour ajouter un style : copiez un bloc, changez la cle et les champs. Aucun
# code a modifier. Le moteur sait gerer des centaines de styles.
#
# Champs par style :
#   key          : identifiant technique unique (lettres/chiffres/underscore)
#   name         : nom affiche dans les metadonnees ("Style")
#   description  : description vestimentaire precise (documentation FR)
#   outfit_prompt: description du vetement injectee dans le prompt image (EN)
#   palette      : couleurs indicatives de la tenue
#   headwear     : couvre-chef eventuel (prompt EN) ou null
#   shoes        : chaussures GENERIQUES sans marque (prompt EN)
#   objects      : liste d'objets possibles. UN SEUL est choisi par personnage.
#                  chaque objet : { key, name, prompt }  (le prompt impose
#                  "single object held in one paw, other paw empty").
#   forbidden    : elements interdits propres au style
#   rarity_weight: poids de tirage (plus grand = plus frequent)
#
# REGLE OBJET UNIQUE : un personnage tient au maximum UN objet, choisi dans
# "objects", et toujours coherent avec le style. La seconde patte reste vide.
# =============================================================================

# Elements interdits communs a TOUS les styles (appliques en plus de "forbidden").
common_forbidden:
  - "human hands"
  - "visible tail"
  - "second held object"
  - "two items in hands"
  - "floating objects"
  - "extra props on the ground"
  - "brand logo"
  - "real trademark"
  - "text"
  - "watermark"

# Chaussures generiques par defaut si un style ne precise rien.
default_shoes: "generic plain shoes without any brand or logo"

