# =============================================================================
# Bibliothèque de styles / métiers / univers (EXTENSIBLE).
# Pour AJOUTER un style : copier une entrée et adapter les champs. Aucun code à
# modifier. Règle absolue : un seul objet tenu en main (held_object).
#
#   code        : identifiant court unique (nom de fichier)
#   name_en     : libellé anglais (prompt + métadonnées)
#   name_fr     : libellé français (attributs / CSV)
#   outfit      : description vestimentaire précise (anglais, pour le prompt)
#   headwear    : couvre-chef ("None" si aucun)
#   held_object : UNIQUE objet tenu ("None" si aucun) — voir règle de l'objet
#   palette     : couleurs dominantes de la tenue (indicatif)
#   forbidden   : éléments interdits propres au style
#   rarity      : palier de base indicatif (Common..Legendary)
# =============================================================================

